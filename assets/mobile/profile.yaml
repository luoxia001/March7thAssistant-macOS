# iOS 版（PlayCover）画面适配配置
# 坐标都是 1920x1080 标准坐标

# PC 模板在移动端默认放大的倍数（移动端 UI 约为 PC 的 1.25 倍）
template_scale: 1.25

# 带透明通道的模板在移动端改用 TM_CCOEFF_NORMED 匹配 这是默认阈值
mask_threshold: 0.7

# 鼠标滚轮每格对应的滑动距离
scroll_step: 60

# 滚轮转滑动的特殊规则 画面里能找到 template 时使用（template 写 PC 模板路径 按移动端比例缩放）
#   axis: horizontal 横向滑动  at: 滑动起点  step: 每格距离
scroll_rules:
  - template: "./assets/images/screen/forgottenhall/memory_of_chaos.png"   # 忘却之庭 关卡横向排列
    region: [0, 0, 400, 150]
    axis: horizontal
    at: [960, 1010]          # 关卡下方的空白处 横向滑动以这里为中心
    step: 300
    max_distance: 1200

# 业务代码里写死的布局数值
layout:
  divergent_save_slot_ys: [265, 427, 590, 753]   # 差分宇宙存档管理 4 个存档位的纵坐标

# 触控布局
touch:
  joystick: [370, 840]        # 左下虚拟摇杆中心（固定摇杆 圆环中心）
  joystick_radius: 140
  phone: [54, 92]             # 左上手机菜单
  map: [160, 180]             # 小地图
  attack: [1598, 822]         # 普通攻击
  technique: [1404, 922]      # 秘技
  sprint: [1776, 920]         # 疾跑
  interact: [1280, 632]       # 交互提示第一项（「➜ 随意门」这一行）
  warp: [1208, 58]            # 顶栏跃迁
  message: [300, 297]         # 左侧短信
  auto_battle: [1722, 60]     # 战斗右上角自动战斗
  team1: [1780, 265]
  team2: [1780, 382]
  team3: [1780, 498]
  team4: [1780, 615]
  back_fallback: [1848, 55]   # 识别不到返回按钮时点右上角关闭位置

# PC 按键 → touch 里的按钮名
keys:
  e: technique
  f: interact
  shift: sprint
  m: map
  f3: warp
  p: message
  v: {button: auto_battle, wait: 1.5}   # 点完等图标变色 避免连点又关掉
  "1": team1
  "2": team2
  "3": team3
  "4": team4

# PC 左键在移动端的替代按钮：region 里识别到 text 时点 tap 而不是普攻
attack_alternatives:
  - text: 下落                 # 流萤等飞行类秘技 飞起后在秘技位置点「下落」开怪
    region: [1340, 975, 130, 50]
    tap: technique

# 按界面覆盖按键 画面里 region 范围内能找到 template 时使用 keys 里的按钮（坐标或 touch 里的按钮名）
key_rules:
  - template: "./assets/images/screen/currency_wars/exit.png"    # 货币战争对局内
    region: [0, 0, 150, 110]
    keys:
      f: [130, 900]        # 购买经验
      d: [1782, 610]       # 商店刷新（商店展开时）
  - template: "./assets/mobile/images/screen/currency_wars/exit_shop_open.png"   # 货币战争对局内 商店展开
    region: [0, 0, 220, 140]
    keys:
      f: [130, 900]
      d: [1782, 610]

# Esc 时依次查找的按钮 第一个找到的会被点击
back_buttons:
  - template: phone
    region: [0, 40, 140, 120]
    threshold: 0.8
  - template: du_exit          # 差分宇宙大世界 左上角面板的退出图标（打开暂离/结算菜单）
    region: [0, 40, 200, 120]
    threshold: 0.8
  - template: close
    region: [1740, 0, 180, 150]
    threshold: 0.75
  # 文字按钮 when 限定弹窗标题（PC 上这些弹窗按 Esc 关闭 移动端只能点按钮）
  - text: 确认
    region: [700, 930, 520, 120]
    when: 快速通关
    when_region: [600, 60, 720, 110]

# 单个模板的覆盖配置（键是 PC 模板路径）
#   scale: 缩放比例  threshold: 移动端匹配阈值
# assets/mobile/images/ 下同路径的图片会替换 PC 模板 默认不缩放
#   icon + badge: 带红点的模板 先找 icon 再检查 icon 左上角为原点的 badge 区域 [x, y, w, h] 里有没有红点
templates:
  # 角色头像 非目标头像的掩码相关系数最高约 0.65
  "./assets/images/share/character/": {scale: 1.25, threshold: 0.85}
  # 忘却之庭/虚构叙事 房间内战斗外左上角的灯泡 PC 的掩码模板在战斗画面也有 0.72
  "./assets/images/purefiction/prepare_fight.png": {threshold: 0.8}
  # 战斗右上角「未开启自动战斗」 不同战斗场景下 0.82~0.90 开启后约 0.34
  # 开启后图标变黄 战斗特效下形状匹配可达 0.75 用黄色像素排除
  "./assets/images/share/base/not_auto.png": {threshold: 0.75, reject_color: {lower: [15, 90, 150], upper: [40, 255, 255], min_pixels: 100}}
  # 货币战争选关 底部「敌人难度」数字 难度1约 0.88 难度2约 0.67
  "./assets/images/screen/universe/homepage.png": {scale: 1.25, threshold: 0.85}   # 差分宇宙首页「开始游戏」 移动端约 0.89
  # 交互条图标 随意门是「➜」 事件是「💬」 差分宇宙事件位面里任一出现都算可以按 F
  # 通用的 share/base/F.png 不加💬 大世界里 NPC 对话也是💬 会误触剧情
  "./assets/images/screen/divergent_universe/f.png": {alternatives: ["./assets/mobile/images/screen/divergent_universe/f_event.png"]}
  "./assets/images/screen/currency_wars/level_1.png": {scale: 1.25, threshold: 0.8}
  # 角色信息面板的前台/后台图标 1.25 倍时对应 0.96 另一个 0.83
  "./assets/images/screen/currency_wars/pos_forward.png": {scale: 1.25}
  "./assets/images/screen/currency_wars/pos_backward.png": {scale: 1.25}
  # 货币战争对局主界面 商店展开时退出按钮被「备战阶段」面板挡住 用面板文字作为备选
  "./assets/images/screen/currency_wars/exit.png": {scale: 1.25, alternatives: ["./assets/mobile/images/screen/currency_wars/exit_shop_open.png"]}
  "./assets/mobile/images/screen/currency_wars/exit_shop_open.png": {scale: 1.0, threshold: 0.85}
  # 手机菜单的奖励红点（移动端红点在图标所在格子的右上角 和 PC 模板里的相对位置不同）
  "./assets/images/share/menu/quest_reward.png": {icon: "./assets/images/share/menu/guide.png", badge: [65, -55, 75, 70]}
  "./assets/images/share/menu/dispatch_reward.png": {icon: "./assets/images/share/menu/dispatch.png", badge: [65, -55, 75, 70]}
  "./assets/images/share/menu/pass_reward.png": {icon: "./assets/images/share/menu/pass.png", badge: [65, -55, 75, 70]}
  "./assets/images/share/menu/achievement_reward.png": {icon: "./assets/images/share/menu/achievement.png", badge: [65, -55, 75, 70]}
  "./assets/images/share/menu/message_reward.png": {icon: "./assets/images/share/menu/message.png", badge: [65, -55, 75, 70]}
  "./assets/images/share/menu/assist_reward.png": {icon: "./assets/images/share/menu/more.png", badge: [20, -45, 70, 50]}

